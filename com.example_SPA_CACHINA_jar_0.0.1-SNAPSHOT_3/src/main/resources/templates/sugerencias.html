<!DOCTYPE html>
<html lang="es"  xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario sugerencias</title>
        <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="/Style/Style_form.css">
        <link rel="stylesheet" href="/Style/Style_carrousel.css">
        <style>
            .spinner {
                width: 150px; /* Tamaño de la imagen del camarón */
                height: 150px;
                background-image: url('imagenes/vecteezy_shrimp-png-clipart_27738778.png');
                background-size: contain;
                background-repeat: no-repeat;
                animation: spin 1s linear infinite;
            }
        </style>    
    </head>

    <body class="d-flex flex-column min-vh-100 bg-custom-2">


        <!-- Navbar -->
        <div th:replace="~{vistas/navbar::encabezado}"></div>

        <!-- Main Content -->
        <div class="container my-5" style="max-width: 90%;">
            <div class="row justify-content-center">
                <div class="col-lg-11">
                    <div class="card shadow-lg" style="background-color: #ffffff; color: #0277bd;">
                        <div class="row g-0">
                            <div class="col-md-4 text-center p-4 d-flex flex-column custom-divider">
                                <div class="mt-4">
                                    <i class="bi bi-geo-alt-fill text-warning" style="font-size: 2.8rem;"></i>
                                    <h5 th:text="#{form.sugerencias.titulo.dirección}"
                                        class="card-title" style="font-size: 1.4rem; color: #0277bd;">Dirección</h5>
                                    <p class="card-text fs-5 fw-light">Prd. 15, Las Flores, San Juan de Lurigancho<br> Lima,
                                        Perú</p>
                                </div>
                                <div class="mt-3">
                                    <i class="bi bi-telephone-fill text-warning" style="font-size: 2.8rem;"></i>
                                    <h5 th:text="#{form.sugerencias.titulo.telefono}"
                                        class="card-title" style="font-size: 1.4rem; color: #0277bd;">Teléfono</h5>
                                    <p class="card-text fs-5 fw-light">920 826 294</p>
                                </div>
                                <div class="mt-3 mb-3">
                                    <i class="bi bi-envelope-fill text-warning" style="font-size: 2.8rem;"></i>
                                    <h5 th:text="#{form.sugerencias.correo}"
                                        class="card-title" style="font-size: 1.4rem; color: #0277bd;">Correo</h5>
                                    <p class="card-text fs-5 fw-light mb-4">Lacachinafish.barracevichera@gmail.com</p>
                                </div>
                            </div>

                            <div class="col-md-8 mt-3 p-4 d-flex flex-column" style="background-color: #f5f5f5;">
                                <h5 th:text="#{form.sugerencias.titulo.sugerencias}"
                                    class="ms-3 card-title text-warning" style="font-size: 1.75rem;">Sugerencias</h5>
                                <p th:text="#{form.sugerencias.titulo.info}"
                                   class="ms-3 card-text fs-5 mb-3" style="color: #0277bd; font-size: 1rem;">Coloque sus
                                    sugerencias.</p>
                                <form th:action="@{/registrarS}" method="post" th:object="${sugerencias}">
                                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                                        <i class="bi bi-exclamation-triangle-fill"></i> 
                                        <span th:text="${errorMessage}"></span>
                                    </div>
                                    <!-- Mostrar mensaje de éxito -->
                                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                                        <i class="bi bi-check-circle-fill"></i> 
                                        <span th:text="${successMessage}"></span>
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>
                                    <div class="mb-4">
                                        <input type="text" class="ms-3 form-control form-control-lg"
                                               style="background-color: #ffffff; color: #0277bd; border-color: #0277bd; font-size: 1.25rem; width: 90%;"
                                               th:placeholder="#{form.sugerencias.nombre.su}"
                                               name="nombre" th:field="*{nombre}" required="true">
                                    </div>
                                    <div class="mb-4">
                                        <input type="email" class="ms-3 form-control form-control-lg"
                                               style="background-color: #ffffff; color: #0277bd; border-color: #0277bd; font-size: 1.25rem; width: 90%;"
                                               th:placeholder="#{form.sugerencias.email.su}"
                                               name="email" th:field="*{correo}" required="true">
                                    </div>
                                    <div class="mb-3">
                                        <textarea class="ms-3 form-control form-control-lg"
                                                  style="background-color: #ffffff; color: #0277bd; border-color: #0277bd; font-size: 1.25rem; width: 90%;"
                                                  rows="5" 
                                                  th:placeholder="#{form.sugerencias.mensaje.su}"
                                                  name="mensaje" th:field="*{mensaje}" required="true">        
                                        </textarea>
                                    </div>

                                    <button th:value="#{form.boton.registrar.su}"  th:text="#{form.boton.registrar.text.su}" type="submit" class="ms-3 mt-3 btn custom-btn"
                                            style="font-size: 1.2rem; padding: 0.5rem 1rem;">Enviar</button>
                                    <button type="button" onclick="window.location.href = '/formResultadoSugerencias'" 
                                            class="ms-3 mt-3 btn custom-btn" style="font-size: 1.2rem; padding: 0.5rem 1rem;"
                                            th:text="#{form.boton.ver.text.su}">Ver sugerencias
                                    </button>
                                </form>
                                <div class="ms-3">
                                    <a th:href="@{/sugerencias(lang='en')}" th:text="#{idioma.ingles}">Inglés</a>
                                    <a th:href="@{/sugerencias(lang='es')}" th:text="#{idioma.castellano}">Castellano</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div th:replace="~{vistas/footer::footer}"></div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

        <script src="/js/funtion_ex.js"></script>
        <script>
                                        // Función para ocultar la pantalla de carga y mostrar el contenido
                                        window.onload = function () {
                                            document.getElementById('loader').style.display = 'none'; // Oculta el loader
                                            document.body.style.visibility = 'visible'; // Muestra el contenido de la página
                                            document.body.style.opacity = '1'; // Transición suave para mostrar el contenido
                                        };
        </script>    
    </body>

</html>
