<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sugerencias</title>
        <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <style>
            #loader {
                position: fixed;
                z-index: 99999;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #1e90ff;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .spinner {
                width: 150px;
                height: 150px;
                background-image: url('/imagenes/vecteezy_shrimp-png-clipart_27738778.png');
                background-size: contain;
                background-repeat: no-repeat;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 0;
            }
            .page-content {
                padding-bottom: 3rem;
            }
            .sug-card {
                border: none;
                border-radius: 16px;
                box-shadow: 0 8px 24px rgba(2, 119, 189, 0.1);
                overflow: hidden;
            }
            .sug-card .info-panel {
                background: linear-gradient(180deg, #0277bd, #01579b);
                color: white;
                padding: 2rem 1.5rem;
                display: flex;
                flex-direction: column;
                justify-content: center;
                height: 100%;
            }
            .sug-card .info-panel .info-item {
                padding: 1rem 0;
                border-bottom: 1px solid rgba(255,255,255,0.15);
            }
            .sug-card .info-panel .info-item:last-child {
                border-bottom: none;
            }
            .sug-card .info-panel .info-item i {
                font-size: 2rem;
                color: #ffc107;
                margin-bottom: 0.5rem;
            }
            .sug-card .info-panel .info-item h5 {
                font-weight: 700;
                font-size: 1.1rem;
                margin-bottom: 0.2rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .sug-card .info-panel .info-item p {
                opacity: 0.9;
                margin: 0;
                font-size: 0.95rem;
            }
            .sug-card .form-panel {
                background: white;
                padding: 2rem 2rem 1.5rem;
            }
            .sug-card .form-panel h3 {
                color: #0277bd;
                font-weight: 700;
                margin-bottom: 0.3rem;
            }
            .sug-card .form-panel .subtitle {
                color: #777;
                font-size: 0.95rem;
                margin-bottom: 1.5rem;
            }
            .sug-card .form-control {
                border-radius: 12px;
                border: 2px solid #e0eef5;
                padding: 0.8rem 1rem;
                font-size: 1rem;
                transition: border-color 0.2s, box-shadow 0.2s;
                background: #fafcfe;
            }
            .sug-card .form-control:focus {
                border-color: #0277bd;
                box-shadow: 0 0 0 4px rgba(2, 119, 189, 0.12);
            }
            .sug-card .form-control::placeholder {
                color: #adb5bd;
            }
            .sug-card textarea.form-control {
                resize: vertical;
            }
            .btn-sug {
                border-radius: 50px;
                padding: 0.7rem 2rem;
                font-weight: 600;
                transition: transform 0.2s;
            }
            .btn-sug:hover {
                transform: translateY(-2px);
            }
            .btn-sug-primary {
                background: #0277bd;
                border: none;
                color: white;
            }
            .btn-sug-primary:hover {
                background: #01579b;
                color: white;
            }
            .btn-sug-outline {
                border: 2px solid #0277bd;
                color: #0277bd;
                background: transparent;
            }
            .btn-sug-outline:hover {
                background: #0277bd;
                color: white;
            }
            .lang-links a {
                color: #0277bd;
                text-decoration: none;
                font-weight: 500;
                margin-right: 1rem;
                font-size: 0.9rem;
            }
            .lang-links a:hover {
                text-decoration: underline;
            }
            @media (max-width: 767px) {
                .sug-card .info-panel {
                    border-radius: 16px 16px 0 0;
                    padding: 1.5rem;
                }
                .sug-card .form-panel {
                    padding: 1.5rem;
                }
                .page-header h1 { font-size: 1.5rem; }
            }
        </style>
    </head>
    <body class="d-flex flex-column min-vh-100 bg-custom-2">
        <div th:replace="~{vistas/navbar::encabezado}"></div>

        <div class="container page-content" style="margin-top: 2rem;">
            <div class="row justify-content-center">
                <div class="col-lg-11 col-xl-10">
                    <div class="sug-card row g-0">
                        <!-- Info panel -->
                        <div class="col-md-4">
                            <div class="info-panel">
                                <div class="info-item text-center">
                                    <i class="bi bi-geo-alt-fill"></i>
                                    <h5>Dirección</h5>
                                    <p>Prd. 15, Las Flores<br>San Juan de Lurigancho, Lima</p>
                                </div>
                                <div class="info-item text-center">
                                    <i class="bi bi-telephone-fill"></i>
                                    <h5>Teléfono</h5>
                                    <p>920 826 294</p>
                                </div>
                                <div class="info-item text-center">
                                    <i class="bi bi-envelope-fill"></i>
                                    <h5>Correo</h5>
                                    <p>Lacachinafish.barracevichera<br>@gmail.com</p>
                                </div>
                            </div>
                        </div>

                        <!-- Form panel -->
                        <div class="col-md-8">
                            <div class="form-panel">
                                <h3><i class="bi bi-pencil-square text-warning me-2"></i>Déjanos tu sugerencia</h3>
                                <p class="subtitle">Tus comentarios nos ayudan a brindarte un mejor servicio.</p>

                                <form th:action="@{/registrarS}" method="post" th:object="${sugerencias}">
                                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                                        <span th:text="${errorMessage}"></span>
                                    </div>
                                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                                        <i class="bi bi-check-circle-fill me-1"></i>
                                        <span th:text="${successMessage}"></span>
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>

                                    <div class="mb-3">
                                        <input type="text" class="form-control"
                                               placeholder="Tu nombre completo"
                                               name="nombre" th:value="${currentUserData != null ? currentUserData.nombres + ' ' + currentUserData.apellidos : ''}" required="true">
                                    </div>
                                    <div class="mb-3">
                                        <input type="email" class="form-control"
                                               placeholder="Tu correo electrónico"
                                               name="email" th:value="${currentUserData?.email}" required="true">
                                    </div>
                                    <div class="mb-3">
                                        <textarea class="form-control" rows="5"
                                                  placeholder="Escribe tu sugerencia aquí..."
                                                  name="mensaje" th:field="*{mensaje}" required="true"></textarea>
                                    </div>

                                    <div class="d-flex flex-wrap gap-2 mt-4">
                                        <button type="submit" class="btn btn-sug btn-sug-primary">
                                            <i class="bi bi-send me-1"></i> Enviar sugerencia
                                        </button>
                                        <button type="button" th:if="${isAdmin}" onclick="window.location.href = '/formResultadoSugerencias'"
                                                class="btn btn-sug btn-sug-outline">
                                            <i class="bi bi-list me-1"></i> Ver sugerencias
                                        </button>
                                    </div>
                                </form>

                                <div class="lang-links mt-4 pt-3 border-top">
                                    <a th:href="@{/sugerencias(lang='en')}"><i class="bi bi-globe me-1"></i>English</a>
                                    <a th:href="@{/sugerencias(lang='es')}"><i class="bi bi-globe me-1"></i>Castellano</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{vistas/footer::footer}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/funtion_ex.js"></script>
        <script>
            window.onload = function () {
                var loader = document.getElementById('loader');
                if (loader) loader.style.display = 'none';
            };
        </script>
    </body>
</html>
