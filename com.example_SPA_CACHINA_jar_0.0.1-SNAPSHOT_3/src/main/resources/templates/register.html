<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registro de Usuario - Cevichería Cachina Fish</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Bootstrap 5.0.2 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <!-- Bootstrap Icons CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

        <style>
            /* Background color for the page */
            body {
                background-color: #f4f9fb; /* Light background for registration */
                font-family: 'Arial', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            /* Centered container for the registration form */
            .register-container {
                background-color: #ffffff;
                border-radius: 15px;
                padding: 40px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
                max-width: 600px;
                width: 90%;
                animation: fadeIn 1s ease-in-out;
            }

            /* Header text styles */
            .register-title {
                color: #f6a945; /* Unique color for register title */
                text-align: center;
                font-weight: bold;
                margin-bottom: 30px;
                font-size: 30px;
                font-family: 'Georgia', serif;
            }

            /* Customize input fields */
            .form-group {
                position: relative;
                margin-bottom: 25px;
            }

            .form-control {
                border: 1px solid #0054a0; /* Blue border for registration */
                border-radius: 8px;
                padding-left: 50px; /* Space for icons */
                width: 100%;
                padding: 12px;
            }

            .form-control:focus {
                border-color: #f6a945; /* Orange border on focus */
                box-shadow: 0 0 0 0.2rem rgba(246, 169, 69, 0.25);
            }

            /* Icon styles */
            .input-group-text {
                background-color: transparent;
                border: 1px solid #0054a0;
                padding-left: 10px;
                padding-right: 15px;
            }

            .input-icon {
                font-size: 18px;
                color: #0054a0;
            }

            /* Customize button */
            .btn-custom {
                background-color: #0054a0; /* Blue */
                border: none;
                color: white;
                padding: 14px 30px;
                border-radius: 8px;
                font-size: 18px;
                font-weight: bold;
                width: 100%;
                transition: background-color 0.3s ease, transform 0.3s ease;
            }

            .btn-custom:hover {
                background-color: #f6a945; /* Orange on hover */
                transform: scale(1.05);
            }

            /* Footer styling */
            .footer {
                text-align: center;
                color: #0054a0;
                font-size: 16px;
                margin-top: 20px;
            }

            .footer a {
                color: #f6a945; /* Orange link */
                text-decoration: none;
            }

            .footer a:hover {
                color: #0054a0;
            }

            /* Animation for fade-in effect */
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div class="register-container">
            <!-- Header with Title -->
            <h2 class="register-title">Regístrate en la Cevichería "Cachina Fish"</h2>

            <!-- Error message -->
            <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

            <!-- Registration Form -->
            <form th:action="@{/register}" method="post">
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person input-icon"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Ingrese su nombre de usuario" required />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock input-icon"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Ingrese su contraseña" required />
                    </div>
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn btn-custom">Registrar</button>
            </form>

            <!-- Footer with additional options -->
            <div class="footer">
                <p>¿Ya tienes una cuenta? <a th:href="@{/login}">Iniciar sesión</a></p>
            </div>
        </div>

        <!-- Bootstrap 5.0.2 JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
