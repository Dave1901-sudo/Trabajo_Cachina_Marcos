<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contactos</title>
        <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="/Style/Style_carrousel.css">
        <link rel="stylesheet" href="/Style/Style_reclamaciones.css">
        <link rel="stylesheet" href="/Style/Style_contact.css">
        <style>
            .spinner {
                width: 150px; /* Tamaño de la imagen del camarón */
                height: 150px;
                background-image: url('imagenes/vecteezy_shrimp-png-clipart_27738778.png');
                background-size: contain;
                background-repeat: no-repeat;
                animation: spin 1s linear infinite;
            }
        </style>
    </head>
    <body class="bg-custom-2">

        <!-- Navbar -->
        <div th:replace="~{vistas/navbar::encabezado}"></div>

        <!-- Contact Page -->
        <div class="container mt-5">
            <div class="contact-card">
                <h2 class="text-center mb-4" th:text="#{form.sugerencias.titulo.contactos}" >Contáctanos</h2>
                <hr>
                <div class="row">
                    <div class="col-md-6 mt-2">
                        <div class="contact-info mb-3">
                            <h5 th:text="#{form.sugerencias.titulo.dirección}" >Dirección</h5>
                            <p>Prd. 15, Las Flores, San Juan de Lurigancho Lima, Perú</p>
                        </div>
                        <div class="contact-info mb-3">
                            <h5 th:text="#{form.sugerencias.titulo.telefono}" >Teléfono</h5>
                            <p> 920 826 294</p>
                        </div>
                        <div class="contact-info mb-3">
                            <h5 th:text="#{form.sugerencias.titulo.Correo}" >Correo Electrónico</h5>
                            <p>Lacachinafish.barracevichera@gmail.com</p>
                        </div>
                    </div>
                    <div class="col-md-6 mt-2">

                        <form th:action="@{/registrar}" method="post" th:object="${contactos}">
                            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                                <i class="bi bi-exclamation-triangle-fill"></i> 
                                <span th:text="${errorMessage}"></span>
                            </div>
                            <!-- Mostrar mensaje de éxito -->
                            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                                <i class="bi bi-check-circle-fill"></i> 
                                <span th:text="${successMessage}"></span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>

                            <div class="form-group mb-3">
                                <label th:text="#{form.sugerencias.nombre}" for="nombre">Nombre</label>
                                <input type="text" class="form-control" id="nombre" th:placeholder="#{form.sugerencias.nombre.placeholder}" 
                                       name="nombre" th:field="*{nombre}" required="true">
                            </div>
                            <div class="form-group mb-3">
                                <label th:text="#{form.sugerencias.correo}" for="email">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" th:placeholder="#{form.sugerencias.correo.placeholder}" 
                                       name="correo" th:field="*{correo}" required="true">
                            </div>
                            <div class="form-group mb-3">
                                <label th:text="#{form.sugerencias.mensaje}" for="mensaje">Mensaje</label>
                                <textarea class="form-control" id="mensaje" rows="4" th:placeholder="#{form.sugerencias.mensaje.placeholder}" 
                                          name="mensaje" th:field="*{mensaje}"required="true"></textarea>
                            </div>
                            <button type="submit" th:value="#{form.boton.registrar}"  th:text="#{form.boton.registrar.text}" class="btn btn-custom btn-lg custom-btn">Enviar</button>
                            <a th:if="${isAdmin}"  id="btnListarContactos" class="btn btn-custom btn-lg custom-btn" 
                               th:text="#{form.boton.ver.contactos}">Ver Contactos</a>
                        </form> 

                        <div>
                            <a th:href="@{/contactos(lang='en')}" th:text="#{idioma.ingles}">Inglés</a>
                            <a th:href="@{/contactos(lang='es')}" th:text="#{idioma.castellano}">Castellano</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mapa de ubicación -->
            <div class="contact-map my-4 bg-light">
                <h2 class="text-center  mb-4 " th:text="#{form.sugerencias.titulo.ubicanos}">Ubícanos</h2>
                <hr>
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3902.6354805417805!2d-77.0164168909787!3d-11.999705540973933!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105cfdc6abbed7f%3A0xbbe55a2021f87f4!2sCEVICHERIA%20%22LA%20CACHINA%20FISH%22!5e0!3m2!1ses-419!2spe!4v1724713122925!5m2!1ses-419!2spe"
                    width="100%"
                    height="400"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy">
                </iframe>
            </div>

        </div>

        <!-- Footer -->
        <div th:replace="~{vistas/footer::footer}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="/js/funtion_ex.js"></script>
        <script>
            // Función para ocultar la pantalla de carga y mostrar el contenido
            window.onload = function () {
                document.getElementById('loader').style.display = 'none'; // Oculta el loader
                document.body.style.visibility = 'visible'; // Muestra el contenido de la página
                document.body.style.opacity = '1'; // Transición suave para mostrar el contenido
            };
        </script>
        <script>
            document.getElementById('btnListarContactos').addEventListener('click', () => {
                fetch('/getListJSON')
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Error en la red');
                            }
                            return response.json();
                        })
                        .then(data => {
                            console.log(data);
                            // Guardar datos en el sessionStorage para compartirlos con la otra página
                            sessionStorage.setItem('listaContactos', JSON.stringify(data));
                            // Redirigir a formResultadoContactos.html
                            window.location.href = 'formResultadoContactos';
                        })
                        .catch(error => {
                            console.error('Error al consultar contacto', error);
                        });
            });
        </script>

    </body>
</html>
