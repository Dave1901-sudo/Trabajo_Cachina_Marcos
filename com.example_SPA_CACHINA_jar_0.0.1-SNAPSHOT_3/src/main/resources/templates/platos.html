<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario platos</title>
        <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="/Style/Style_form.css">
        <link rel="stylesheet" href="/Style/Style_carrousel.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"/>
        <style>
            .spinner {
                width: 150px; /* Tamaño de la imagen del camarón */
                height: 150px;
                background-image: url('imagenes/vecteezy_shrimp-png-clipart_27738778.png');
                background-size: contain;
                background-repeat: no-repeat;
                animation: spin 1s linear infinite;
            }
        </style>    
    </head>

    <body class="d-flex flex-column min-vh-100 bg-custom-2">


        <!-- Navbar -->
        <div th:replace="~{vistas/navbar::encabezado}"></div>
        <!-- Main Content -->
        <div class="container my-5" style="max-width: 90%;">
            <div class="row justify-content-center">

                <div class="col-md-8 bg-light shadow-lg rounded p-4">
                    <h5 class="card-title text-warning text-center mb-3" style="font-size: 1.75rem;">Platos</h5>
                    <p class="card-text text-primary text-center fs-5 mb-4">Ingrese sus Platos.</p>

                    <form th:action="@{/registrarPlatos}" method="post" th:object="${platos}" enctype="multipart/form-data" onsubmit="return validarCategoria() && validarTamañoArchivo()">

                        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> 
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <div class="mb-3">
                            <input type="text" 
                                   class="form-control form-control-lg border-primary"
                                   placeholder="Nombre del plato"
                                   name="nombre" th:field="*{nombre}" required="true">
                        </div>

                        <div class="mb-3">
                            <input type="text" 
                                   class="form-control form-control-lg border-primary"
                                   placeholder="Descripcion del plato"
                                   name="descripcion" th:field="*{descripcion}" required="true">
                        </div>

                        <div class="mb-3">
                            <input type="number" 
                                   class="form-control form-control-lg border-primary"
                                   placeholder="Precio del plato"
                                   name="precio" th:field="*{precio}" required="true" step="0.01">
                        </div>

                        <div class="mb-3">
                            <input type="file" 
                                   class="form-control form-control-lg border-primary"
                                   th:placeholder="#{imagen URL}"
                                   name="imagenArchivo" id="imagenArchivo" accept="image/*" required="true">
                        </div>

                        <div class="mb-3">
                            <select class="form-control form-control-lg border-primary" id="categoriaSelect" onchange="toggleNuevaCategoria(this)">
                                <option value="">-- Seleccionar categoría --</option>
                                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}"></option>
                                <option value="__NUEVA__">+ Agregar categoría nueva</option>
                            </select>
                            <input type="text" 
                                   class="form-control form-control-lg border-primary mt-2"
                                   placeholder="Escriba la nueva categoría"
                                   name="categoria" th:field="*{categoria}" required="true"
                                   id="categoriaInput" style="display: none;">
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="submit" 
                                    class="btn btn-success btn-lg me-2" 
                                    style="font-size: 1.2rem;">Enviar</button>
                            <button type="button" 
                                    onclick="window.location.href = '/formResultadoPlatos'" 
                                    class="btn btn-secondary btn-lg" 
                                    style="font-size: 1.2rem;">
                                Ver platos almacenados
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>


        <!-- Footer -->
        <div th:replace="~{vistas/footer::footer}"></div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script>
            function toggleNuevaCategoria(select) {
                var input = document.getElementById('categoriaInput');
                if (select.value === '__NUEVA__') {
                    input.style.display = 'block';
                    input.value = '';
                    input.focus();
                } else {
                    input.style.display = 'none';
                    input.value = select.value;
                }
            }
            function validarCategoria() {
                var select = document.getElementById('categoriaSelect');
                var input = document.getElementById('categoriaInput');
                if (select.value === '__NUEVA__' && input.value.trim() !== '') {
                    var options = select.options;
                    for (var i = 0; i < options.length; i++) {
                        if (options[i].value !== '' && options[i].value !== '__NUEVA__' && options[i].value.toLowerCase() === input.value.trim().toLowerCase()) {
                            Swal.fire({
                                toast: true,
                                position: 'bottom-end',
                                icon: 'warning',
                                title: 'Esa categoría ya existe. Selecciónala del listado.',
                                showConfirmButton: false,
                                timer: 2500,
                                timerProgressBar: false
                            });
                            return false;
                        }
                    }
                }
                return true;
            }
            function validarTamañoArchivo() {
                var fileInput = document.getElementById('imagenArchivo');
                if (fileInput.files.length > 0) {
                    var fileSize = fileInput.files[0].size;
                    var maxSize = 10 * 1024 * 1024;
                    if (fileSize > maxSize) {
                        Swal.fire({
                            toast: true,
                            position: 'bottom-end',
                            icon: 'error',
                            title: 'El archivo es demasiado grande. Máximo 10 MB.',
                            showConfirmButton: false,
                            timer: 3000,
                            timerProgressBar: false
                        });
                        return false;
                    }
                }
                return true;
            }
        </script>
        <script src="/js/funtion_ex.js"></script>
        <script>
                                        window.onload = function () {
                                            document.getElementById('loader').style.display = 'none';
                                            document.body.style.visibility = 'visible';
                                            document.body.style.opacity = '1';
                                        };
        </script>
    </body>

</html>
