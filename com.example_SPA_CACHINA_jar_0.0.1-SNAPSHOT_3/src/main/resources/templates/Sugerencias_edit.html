<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sugerencias_editar</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>
<body style="background-color: #00bfff">
    <div class="container my-5">
        <h1 class="text-center mb-4 text-white">Sugerencias a editar</h1>
        <form th:action="@{/registrarS}" th:object="${sugerencias}" method="post">
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>
            <div class="mb-3">
                <label for="idcolaborador" class="form-label text-white">Id Sugerencias:</label>
                <input type="number" th:field="*{idsugerencias}" class="form-control bg-transparent border-light text-white" readonly="true"/> 
            </div>  
            <div class="mb-3">
                <label for="nombre" class="form-label text-white">Nombre:</label>
                <input type="text" th:field="*{nombre}" class="form-control bg-transparent border-light text-white" required="true"/> 
            </div>    
            <div class="mb-3">
                <label for="correo" class="form-label text-white">Correo:</label>
                <input type="email" th:field="*{correo}" class="form-control bg-transparent border-light text-white" required="true"/> 
            </div>  
            <div class="mb-3">
                <label th:text="#{form.sugerencias.mensaje}" for="mensaje" class="form-label text-white">Mensaje</label>
                <textarea id="mensaje" rows="4" th:placeholder="#{form.sugerencias.mensaje.placeholder}" name="mensaje" th:field="*{mensaje}" class="form-control bg-transparent border-light text-white" required="true"></textarea>
            </div>  
            <div class="text-center">
                <button type="submit" class="btn btn-warning btn-block fw-bold py-3" style="border-radius: 2rem;">Guardar</button>
            </div>
            <div class="text-center mt-3">
                <a href="/formResultadoSugerencias" class="btn btn-warning text-white">Volver sin Guardar</a>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
</body>

</html>
