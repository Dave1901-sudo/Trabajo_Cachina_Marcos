<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Resultado del Registro</title>
    <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/Style/Style_carrousel.css">
    <link rel="stylesheet" href="/Style/frmResevaresultado.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .spinner {
            width: 150px; height: 150px;
            background-image: url('imagenes/vecteezy_shrimp-png-clipart_27738778.png');
            background-size: contain; background-repeat: no-repeat;
            animation: spin 1s linear infinite;
        }
        .filter-section {
            background: rgba(255,255,255,0.85);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .filter-section .form-control, .filter-section .form-select {
            border-radius: 10px;
        }
        .reserva-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .reserva-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        .reserva-card .card-header-reserva {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            color: #fff;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .reserva-card .card-body {
            padding: 20px;
        }
        .reserva-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .reserva-detail:last-child {
            border-bottom: none;
        }
        .reserva-detail i {
            width: 20px;
            font-size: 1.1rem;
        }
        .reserva-detail .label {
            font-size: 0.85rem;
            color: #888;
            min-width: 60px;
        }
        .reserva-detail .value {
            font-size: 0.95rem;
            color: #333;
            font-weight: 500;
        }
        .reserva-card .card-actions {
            padding: 14px 20px;
            background: #fafafa;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .date-group-header {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e88e5;
            padding: 12px 0 8px 0;
            border-bottom: 2px solid #1e88e5;
            margin-bottom: 16px;
            margin-top: 24px;
        }
        .date-group-header:first-child {
            margin-top: 0;
        }
        .reserva-card.mi-reserva {
            box-shadow: 0 0 0 3px #ffc107, 0 4px 20px rgba(0,0,0,0.06);
        }
        .reserva-card.mi-reserva .card-header-reserva {
            background: linear-gradient(135deg, #f9a825, #f57f17);
        }
    </style>
</head>
<body>
    <div th:replace="~{vistas/navbar::encabezado}"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="info-title mb-0" th:text="#{form.sugerencias.legend.genera.re}">Información de la reserva</h1>
            <div>
                <a th:href="@{/#reservas}" class="btn cevicheria-btn-custom">
                    <i class="bi bi-plus-circle"></i> Agregar Reserva
                </a>
                <a th:if="${isAdmin}" href="javascript:void(0)" onclick="verTodas()" class="btn btn-info text-white fw-bold shadow-sm ms-2">
                    <i class="bi bi-calendar2-week"></i> Ver todas las reservas
                </a>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filter-section mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold text-primary"><i class="bi bi-search"></i> Buscar</label>
                    <input type="text" id="filterSearch" class="form-control" placeholder="Nombre o correo..." oninput="renderReservas()">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold text-primary"><i class="bi bi-calendar"></i> Fecha</label>
                    <input type="date" id="filterDate" class="form-control" onchange="renderReservas()">
                </div>
                <div class="col-md-3 d-flex align-items-end gap-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="checkResaltar" onchange="renderReservas()">
                        <label class="form-check-label fw-bold text-primary" for="checkResaltar">
                            <i class="bi bi-star-fill text-warning"></i> Resaltar mis reservas
                        </label>
                    </div>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-outline-warning flex-fill" id="btnMisReservas" onclick="toggleMisReservas()">
                        <i class="bi bi-person-lines-fill"></i> Mis reservas
                    </button>
                    <button class="btn btn-outline-secondary" onclick="limpiarFiltros()">
                        <i class="bi bi-x-circle"></i> Limpiar
                    </button>
                </div>
            </div>
        </div>

        <!-- Tarjetas -->
        <div class="cevicheria-container-transparent p-4 mb-5">
            <div id="reservasContainer">
                <!-- Se renderiza con JS -->
            </div>
            <div id="noResults" class="text-center py-5 d-none">
                <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                <p class="text-muted mt-2">No se encontraron reservas.</p>
            </div>
        </div>

        <!-- Botón volver -->
        <div class="text-center">
            <a th:if="${isAdmin}" href="/admin" class="btn cevicheria-btn-custom mt-3">
                <i class="bi bi-arrow-left-circle"></i> Volver al Panel Administrativo
            </a>
            <a th:unless="${isAdmin}" href="/#reservas" class="btn cevicheria-btn-custom mt-3">
                <i class="bi bi-arrow-left-circle"></i> Volver
            </a>
        </div>

        <footer class="info-footer mt-3">
            <p>© 2026 Cevichería - San Juan de Lurigancho</p>
        </footer>
    </div>

    <div th:replace="~{vistas/footer::footer}"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const todasLasReservas = /*[[${lista}]]*/ [];
        const currentUserEmail = /*[[${currentUserData != null ? currentUserData.email : ''}]]*/ '';

        let modoMisReservas = false;
        let misReservasData = [];

        function getCardHTML(r) {
            const esMiReserva = currentUserEmail && r.correo === currentUserEmail;
            const highlight = document.getElementById('checkResaltar').checked && esMiReserva;
            let acciones = '';
            if (/*[[${isAdmin}]]*/ false) {
                acciones += '<a href="/getEditReservas/' + r.idreservas + '" class="btn btn-outline-primary btn-sm rounded-pill px-3">' +
                    '<i class="bi bi-pencil"></i> Editar</a>' +
                    '<a href="/deleteReservas?id=' + r.idreservas + '" class="btn btn-outline-danger btn-sm rounded-pill px-3">' +
                    '<i class="bi bi-trash"></i> Eliminar</a>';
            } else if (esMiReserva && r.createdAt) {
                var creada = new Date(r.createdAt);
                var ahora = new Date();
                var difMs = ahora.getTime() - creada.getTime();
                if (difMs >= 0 && difMs <= 5 * 60 * 1000) {
                    acciones += '<button onclick="cancelarMiReserva(' + r.idreservas + ', this)" class="btn btn-outline-danger btn-sm rounded-pill px-3">' +
                        '<i class="bi bi-x-circle"></i> Cancelar</button>';
                }
            }
            return '<div class="col-md-6 col-lg-4 mb-4">' +
                '<div class="card reserva-card animate__animated animate__fadeIn h-100' +
                (highlight ? ' mi-reserva' : '') + '">' +
                '<div class="card-header-reserva">' +
                '<i class="bi bi-person-circle me-2"></i>' +
                '<span>' + (r.nombre || '') + '</span>' +
                '</div>' +
                '<div class="card-body">' +
                '<div class="reserva-detail">' +
                '<i class="bi bi-envelope text-primary"></i>' +
                '<span class="label">Correo</span>' +
                '<span class="value">' + (r.correo || '') + '</span>' +
                '</div>' +
                '<div class="reserva-detail">' +
                '<i class="bi bi-calendar-event text-success"></i>' +
                '<span class="label">Fecha</span>' +
                '<span class="value">' + (r.fecha || '') + '</span>' +
                '</div>' +
                '<div class="reserva-detail">' +
                '<i class="bi bi-clock text-warning"></i>' +
                '<span class="label">Hora</span>' +
                '<span class="value">' + (r.hora || '') + '</span>' +
                '</div>' +
                '<div class="reserva-detail">' +
                '<i class="bi bi-people text-info"></i>' +
                '<span class="label">Personas</span>' +
                '<span class="value">' + (r.personas || '') + '</span>' +
                '</div>' +
                '</div>' +
                (acciones
                    ? '<div class="card-actions">' + acciones + '</div>'
                    : '') +
                '</div>' +
                '</div>';
        }

        function cancelarMiReserva(id, btn) {
            if (!confirm('¿Estás seguro de cancelar esta reserva?')) return;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            fetch('/cancelarMiReserva?id=' + id, { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {
                        Swal.fire({ icon: 'success', title: 'Cancelada', text: data.message, timer: 2000, showConfirmButton: false });
                        renderReservas();
                    } else {
                        Swal.fire({ icon: 'error', title: 'Error', text: data.message });
                        btn.disabled = false;
                        btn.innerHTML = '<i class="bi bi-x-circle"></i> Cancelar';
                    }
                })
                .catch(function() {
                    Swal.fire({ icon: 'error', title: 'Error', text: 'Error al cancelar la reserva.' });
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-x-circle"></i> Cancelar';
                });
        }

        function renderReservas() {
            if (modoMisReservas) {
                mostrarMisReservas();
                return;
            }
            const search = document.getElementById('filterSearch').value.toLowerCase().trim();
            const filterDate = document.getElementById('filterDate').value;
            const container = document.getElementById('reservasContainer');
            const noResults = document.getElementById('noResults');

            let filtradas = todasLasReservas.filter(function(r) {
                if (search) {
                    const n = (r.nombre || '').toLowerCase();
                    const c = (r.correo || '').toLowerCase();
                    if (!n.includes(search) && !c.includes(search)) return false;
                }
                if (filterDate && r.fecha !== filterDate) return false;
                return true;
            });

            filtradas.sort(function(a, b) {
                if (a.fecha !== b.fecha) return a.fecha < b.fecha ? -1 : 1;
                return (a.hora || '00:00').localeCompare(b.hora || '00:00');
            });

            const grupos = {};
            filtradas.forEach(function(r) {
                const f = r.fecha || 'Sin fecha';
                if (!grupos[f]) grupos[f] = [];
                grupos[f].push(r);
            });

            let html = '';
            Object.keys(grupos).forEach(function(fecha) {
                html += '<div class="date-group-header">' +
                    '<i class="bi bi-calendar3 me-2"></i>' + fecha + '</div>';
                html += '<div class="row">';
                grupos[fecha].forEach(function(r) {
                    html += getCardHTML(r);
                });
                html += '</div>';
            });

            container.innerHTML = html;
            noResults.classList.toggle('d-none', filtradas.length > 0);
        }

        function mostrarMisReservas() {
            const container = document.getElementById('reservasContainer');
            const noResults = document.getElementById('noResults');
            if (misReservasData.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('d-none');
                return;
            }
            misReservasData.sort(function(a, b) {
                if (a.fecha !== b.fecha) return a.fecha < b.fecha ? -1 : 1;
                return (a.hora || '00:00').localeCompare(b.hora || '00:00');
            });
            const grupos = {};
            misReservasData.forEach(function(r) {
                const f = r.fecha || 'Sin fecha';
                if (!grupos[f]) grupos[f] = [];
                grupos[f].push(r);
            });
            let html = '';
            Object.keys(grupos).forEach(function(fecha) {
                html += '<div class="date-group-header">' +
                    '<i class="bi bi-calendar3 me-2"></i>' + fecha + '</div>';
                html += '<div class="row">';
                grupos[fecha].forEach(function(r) {
                    html += getCardHTML(r);
                });
                html += '</div>';
            });
            container.innerHTML = html;
            noResults.classList.toggle('d-none', misReservasData.length > 0);
        }

        function toggleMisReservas() {
            const btn = document.getElementById('btnMisReservas');
            if (!modoMisReservas) {
                if (!currentUserEmail) return;
                const btnText = btn.innerHTML;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Cargando...';
                fetch('/mis-reservas')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        misReservasData = data;
                        modoMisReservas = true;
                        btn.classList.remove('btn-outline-warning');
                        btn.classList.add('btn-warning');
                        renderReservas();
                        btn.innerHTML = '<i class="bi bi-person-lines-fill"></i> Mis reservas';
                    })
                    .catch(function() {
                        btn.innerHTML = '<i class="bi bi-person-lines-fill"></i> Mis reservas';
                    });
            } else {
                modoMisReservas = false;
                btn.classList.remove('btn-warning');
                btn.classList.add('btn-outline-warning');
                renderReservas();
            }
        }

        function limpiarFiltros() {
            if (modoMisReservas) {
                toggleMisReservas();
            }
            document.getElementById('filterSearch').value = '';
            function getHoyLocal() {
                var d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }
            document.getElementById('filterDate').value = getHoyLocal();
            document.getElementById('checkResaltar').checked = false;
            renderReservas();
        }

        function verTodas() {
            if (modoMisReservas) {
                toggleMisReservas();
            }
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterDate').value = '';
            document.getElementById('checkResaltar').checked = false;
            renderReservas();
        }

        // Inicializar filtro fecha con hoy
        document.addEventListener('DOMContentLoaded', function() {
            function getHoyLocal() {
                var d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }
            var hoy = getHoyLocal();
            var fechaInput = document.getElementById('filterDate');
            if (!/*[[${isAdmin}]]*/ false) {
                fechaInput.setAttribute('min', hoy);
            }
            fechaInput.value = hoy;
            renderReservas();
        });

        window.onload = function () {
            document.getElementById('loader').style.display = 'none';
            document.body.style.visibility = 'visible';
            document.body.style.opacity = '1';
        };
    </script>
</body>
</html>
