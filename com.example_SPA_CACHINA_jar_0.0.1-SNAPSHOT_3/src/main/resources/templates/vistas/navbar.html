<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">

    <body th:fragment="encabezado"> 
        <div id="loader">
            <div class="spinner"></div>
        </div>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    <img src="imagenes/Logo.jpg" alt="Cachina Fish" class="navbar-logo">
                        Cachina Fish
                </a>
                <button class="navbar-toggler border border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a th:text="#{navbar.inicio}" class="nav-link" th:href="@{/}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a th:text="#{navbar.menu}" class="nav-link" href="#card-container">Menú</a>
                        </li>
                        <li class="nav-item">
                            <a th:text="#{navbar.reservas}" class="nav-link" href="#reservas">Reservas</a>
                        </li>
                        <li class="nav-item">
                            <a th:text="#{navbar.galeria}" class="nav-link" href="#galeria">Galería</a>
                        </li>
                        <li class="nav-item">
                            <a th:text="#{navbar.contacto}" class="nav-link" href="#footer">Contacto</a>
                        </li>
                        <!-- Dropdown para idiomas -->

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-translate"></i> Idioma
                            </a>
                            <ul class="dropdown-menu custom-dropdown" aria-labelledby="navbarDropdownMenuLink">
                                <li>
                                    <a class="dropdown-item" th:href="@{/?lang=es}" th:text="#{idioma.castellano}">Castellano</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/?lang=en}" th:text="#{idioma.ingles}">Inglés</a>
                                </li>
                            </ul>
                        </li>
                        <!-- Dropdown para el usuario -->
                        <li class="nav-item dropdown">
                            <button class="nav-link dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="background-color: transparent; border: none; color: white;">
                                <!-- Icono de usuario -->
                                <i class="bi bi-person-fill" style="margin-right: 8px;"></i>
                                <span th:text="${currentUser != null ? 'Bienvenido, ' + currentUser : 'Sin usuario'}"></span>
                            </button>
                            <ul class="dropdown-menu custom-dropdown" aria-labelledby="navbarDropdownMenuLink">
                                <span th:if="${currentUser != null}">

                                    <li>
                                        <a class="dropdown-item" th:href="@{/perfil}">
                                            Ver perfil
                                        </a>
                                    </li>

                                    <li>
                                        <a class="dropdown-item" th:href="@{/historial-pedidos}">
                                            Historial de pedidos
                                        </a>
                                    </li>

                                    <li th:if="${isAdmin}">
                                        <a class="dropdown-item" th:href="@{/admin}">
                                            Panel de Administración
                                        </a>
                                    </li>

                                    <li><hr class="dropdown-divider"></li>

                                    <form action="/logout" method="POST">
                                        <button class="dropdown-item" type="submit">
                                            Cerrar sesión
                                        </button>
                                    </form>

                                </span>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Bootstrap 5 CSS -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
            <!-- Bootstrap Icons -->
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
                <!-- Google Fonts -->
                <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@400;700&display=swap">

                    <style>
                        .navbar-custom {
                            position: relative;
                            background: transparent; /* Degradado azul vibrante */
                            z-index: 1020;
                        }

                        .navbar-custom::before {
                            content: "";
                            position: absolute;
                            top: 0;
                            left: 0;
                            right: 0;
                            bottom: 0;
                            background: linear-gradient(135deg, #1e90ff, #00bfff); /* Degradado azul vibrante */
                            clip-path: polygon(0 0, 100% 0, 100% 75%, 0 100%); /* Aplicar el clip aquí */
                            z-index: -1; /* Envía el pseudo-elemento detrás del contenido */
                            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); /* Sombra para efecto de profundidad */
                            border-bottom: 5px solid #ffffff; /* Borde blanco en la parte inferior para un acabado limpio */
                        }
                        .navbar-custom .navbar-brand {
                            font-family: 'Pacifico', cursive;
                            font-size: 2.5rem;
                            font-weight: bold;
                            color: #ffffff;
                            display: flex;
                            align-items: center;
                            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); /* Sombra para darle un efecto de profundidad */
                        }
                        .navbar-custom .navbar-logo {
                            margin-right: 15px;
                            width: 60px; /* Tamaño del logo aumentado */
                        }
                        .navbar-custom .nav-link {
                            color: #ffffff;
                            font-family: 'Roboto', sans-serif;
                            font-size: 1.3rem;
                            font-weight: 600;
                            transition: color 0.3s ease, transform 0.3s ease, background-color 0.3s ease, padding 0.3s ease;
                            padding: 10px 15px; /* Espaciado para hacer los enlaces más grandes y clicables */
                        }
                        .navbar-custom .nav-link:hover {
                            color: #fff700; /* Color amarillo vibrante para el hover */
                            background-color: rgba(255, 255, 255, 0.2); /* Fondo semitransparente para destacar */
                            border-radius: 5px;
                            transform: scale(1.1); /* Efecto de zoom al pasar el cursor */
                            box-shadow: 0 4px 8px rgba(0,0,0,0.3); /* Sombra para efecto de profundidad */
                        }
                        .navbar-toggler {
                            border: none;
                            background: rgba(255, 255, 255, 0.2); /* Fondo semitransparente para el botón */
                        }
                        .navbar-toggler-icon {
                            background-image: url('data:image/svg+xml;charset=utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"%3E%3Cpath stroke="rgba(255,255,255,0.9)" stroke-width="2" d="M5 7h20M5 15h20M5 23h20"/%3E%3C/svg%3E');
                        }
                        .custom-dropdown {
                            background-color: rgba(255, 255, 255, 0.85) !important; /* Fondo semitransparente */
                            backdrop-filter: blur(5px); /* Efecto de desenfoque */
                            border: 1px solid rgba(0, 0, 0, 0.1); /* Borde sutil */
                        }

                        .custom-dropdown .dropdown-item {
                            color: #333; /* Color del texto */
                            transition: background-color 0.3s ease, color 0.3s ease;
                        }

                        .custom-dropdown .dropdown-item:hover {
                            background-color: rgba(0, 123, 255, 0.15); /* Color de fondo al pasar el cursor */
                            color: #007bff; /* Color del texto al pasar el cursor */
                        }
                        
                        /* Media query para dispositivos móviles */
    @media (max-width: 768px) {
        .navbar-custom {
            padding: 28px 0; /* Aumentar el alto del navbar en pantallas pequeñas */
        }

        .navbar-custom .navbar-brand {
            font-size: 2rem; /* Ajustar tamaño del logo en pantallas más pequeñas */
        }

        .navbar-custom .nav-link {
            font-size: 1.1rem; /* Ajustar tamaño del texto de los enlaces en pantallas pequeñas */
        }

        .navbar-custom .navbar-logo {
            width: 50px; /* Reducir tamaño del logo en pantallas pequeñas */
        }
    }

                    </style>

                    </body>
                    </html>
