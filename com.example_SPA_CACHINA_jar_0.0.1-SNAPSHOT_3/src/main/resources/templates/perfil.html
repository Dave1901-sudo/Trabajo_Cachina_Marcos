<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil · Cachina Fish</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5.0.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --azul: #0277bd;
            --naranja: #ffa500;
            --azul-oscuro: #01579b;
            --celeste: #e0f7fa;
            --gris-claro: #f4fbfd;
            --blanco: #ffffff;
            --borde: #cfe8ef;
            --texto: #1e293b;
            --texto-secundario: #5e6e82;
            --gris-hover: #eefaff;
        }

        body {
            background:
                linear-gradient(180deg, rgba(224, 247, 250, 0.95) 0%, #f8fdff 45%, #ffffff 100%);
            font-family: 'Inter', 'Segoe UI', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        #loader {
            position: fixed;
            z-index: 99999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e90ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 150px;
            height: 150px;
            background-image: url('/imagenes/vecteezy_shrimp-png-clipart_27738778.png');
            background-size: contain;
            background-repeat: no-repeat;
            animation: spin 1s linear infinite;
        }

        .page-enter {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        body.page-loaded .page-enter {
            opacity: 1;
            transform: translateY(0);
        }

        .perfil-hero {
            position: relative;
            overflow: hidden;
            width: 100%;
            background:
                linear-gradient(135deg, rgba(2, 119, 189, 0.96) 0%, rgba(0, 181, 226, 0.94) 52%, rgba(255, 140, 0, 0.96) 100%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: auto, 46px 46px, 46px 46px;
            color: #ffffff;
            text-align: center;
            padding: 3.75rem 1rem 4.7rem;
            box-shadow: 0 10px 26px rgba(2, 119, 189, 0.16);
        }

        .perfil-hero::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 68px;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(244,251,253,0.88) 72%, #f4fbfd 100%);
        }

        .perfil-hero-contenido {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
        }

        .perfil-kicker {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            margin-bottom: 0.8rem;
            padding: 0.35rem 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08rem;
            text-transform: uppercase;
        }

        .perfil-hero h1 {
            font-weight: 700;
            font-size: 2.55rem;
            letter-spacing: 0;
            margin-bottom: 0.65rem;
        }

        .perfil-hero .descripcion {
            max-width: 620px;
            margin: 0 auto 1.15rem;
            font-size: 1.04rem;
            line-height: 1.65;
            opacity: 0.95;
        }

        .perfil-usuario {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            opacity: 0.96;
        }

        .perfil-wrapper {
            flex: 1;
            padding: 0 0 3rem;
        }

        .tarjeta-perfil {
            background: var(--blanco);
            border: 1px solid var(--borde);
            border-top: 5px solid var(--naranja);
            border-radius: 0.75rem;
            box-shadow: 0 8px 22px rgba(2, 119, 189, 0.1);
            padding: 2.25rem 2.5rem;
            max-width: 850px;
            margin: -2.35rem auto 0;
            position: relative;
            z-index: 2;
            transition: box-shadow 0.3s;
        }

        .tarjeta-titulo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--azul-oscuro);
            margin-bottom: 0.3rem;
        }

        .tarjeta-subtitulo {
            font-size: 0.95rem;
            color: var(--texto-secundario);
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--celeste);
            padding-bottom: 1.2rem;
        }

        @media (max-width: 576px) {
            .tarjeta-perfil {
                padding: 1.8rem 1.2rem;
                border-radius: 0.75rem;
            }

            .perfil-hero {
                padding: 2.7rem 1rem 4rem;
            }

            .perfil-hero h1 {
                font-size: 1.9rem;
            }
        }

        /* Bloque de campo */
        .campo-bloque {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 0.65rem;
            border-bottom: 1px solid var(--borde);
            transition: background 0.2s ease, padding-left 0.2s ease, transform 0.2s ease;
            border-radius: 0.5rem;
        }

        .campo-bloque:last-child {
            border-bottom: none;
        }

        .campo-bloque:hover {
            background-color: var(--gris-hover);
            padding-left: 0.95rem;
            padding-right: 0.95rem;
            transform: translateY(-2px);
        }

        .campo-info {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            min-width: 0;
            flex: 1;
        }

        .campo-icono {
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            background: var(--celeste);
            color: var(--azul);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            text-align: center;
            flex-shrink: 0;
        }

        .campo-detalle {
            min-width: 0;
        }

        .campo-etiqueta {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--texto-secundario);
            margin-bottom: 0.15rem;
        }

        .campo-valor {
            font-weight: 650;
            color: var(--texto);
            word-break: break-word;
            font-size: 1rem;
        }

        .campo-acciones {
            flex-shrink: 0;
            margin-left: 1rem;
        }

        /* Botones */
        .btn-editar {
            background: transparent;
            border: 1px solid var(--azul);
            color: var(--azul);
            border-radius: 0.35rem;
            padding: 0.4rem 1.1rem;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.25s;
            cursor: pointer;
        }

        .btn-editar:hover {
            background: var(--azul);
            color: white;
            box-shadow: 0 4px 10px rgba(2, 119, 189, 0.25);
        }

        .btn-guardar {
            background: var(--azul);
            border: none;
            color: white;
            border-radius: 0.35rem;
            padding: 0.45rem 1.1rem;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.25s;
            cursor: pointer;
        }

        .btn-guardar:hover {
            background: var(--azul-oscuro);
            box-shadow: 0 4px 12px rgba(1, 87, 155, 0.28);
        }

        .btn-cancelar {
            background: transparent;
            border: 1.5px solid #6c757d;
            color: #6c757d;
            border-radius: 0.35rem;
            padding: 0.45rem 1.1rem;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.25s;
            cursor: pointer;
        }

        .btn-cancelar:hover {
            background: #6c757d;
            color: white;
        }

        /* Inputs */
        .input-edicion {
            border: 1px solid var(--azul);
            border-radius: 0.35rem;
            padding: 0.55rem 0.8rem;
            font-size: 0.95rem;
            width: 100%;
            max-width: 300px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-edicion:focus {
            border-color: var(--naranja);
            box-shadow: 0 0 0 0.2rem rgba(246,169,69,0.2);
            outline: none;
        }

        .error-mensaje {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: none;
        }

        /* Estados */
        .modo-lectura {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .modo-edicion {
            display: none;
            width: 100%;
            flex-direction: column;
        }

        .campo-bloque.editando .modo-lectura {
            display: none;
        }

        .campo-bloque.editando .modo-edicion {
            display: flex;
        }

        .campo-bloque.editando .campo-acciones {
            display: none;
        }

        .form-edicion {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            flex-wrap: wrap;
            width: 100%;
        }

        .input-group-edicion {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }

        .botones-edicion {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .campo-bloque.editando .modo-edicion {
            animation: fadeIn 0.2s ease;
        }

        .cargando-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 0.3rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{vistas/navbar::encabezado}"></div>

    <section class="perfil-hero page-enter">
        <div class="perfil-hero-contenido">
            <div class="perfil-kicker">
                <i class="bi bi-person-badge"></i>
                Área personal
            </div>
            <h1>Mi Perfil</h1>
            <p class="descripcion">Administra tu información personal y mantén tus datos actualizados desde un solo lugar.</p>
            <div class="perfil-usuario">
                <i class="bi bi-at"></i>
                <span th:text="${usuario.username}">usuario</span>
            </div>
        </div>
    </section>

    <div class="perfil-wrapper page-enter">
        <div class="container">
            <!-- Tarjeta de perfil -->
            <div class="tarjeta-perfil">

                <!-- Título de la sección -->
                <h3 class="tarjeta-titulo">Información personal</h3>
                <p class="tarjeta-subtitulo">Aquí puedes consultar y actualizar tus datos personales.</p>

                <!-- ============================== -->
                <!-- Nombres (editable) -->
                <!-- ============================== -->
                <div id="campo-nombres" class="campo-bloque">
                    <div class="modo-lectura">
                        <div class="campo-info">
                            <div class="campo-icono"><i class="bi bi-person"></i></div>
                            <div class="campo-detalle">
                                <div class="campo-etiqueta">Nombres</div>
                                <div class="campo-valor" th:text="${usuario.nombres != null ? usuario.nombres : '-'}"></div>
                            </div>
                        </div>
                        <div class="campo-acciones">
                            <button class="btn-editar" type="button" onclick="activarEdicion('campo-nombres')">Editar</button>
                        </div>
                    </div>
                    <div class="modo-edicion">
                        <form class="form-edicion" th:action="@{/perfil/actualizar}" method="post"
                              data-idcampo="campo-nombres"
                              onsubmit="return guardarCampo(event, this, 'campo-nombres')">
                            <input type="hidden" name="id" th:value="${usuario.id}" />
                            <input type="hidden" name="campo" value="nombres" />
                            <div class="input-group-edicion">
                                <input type="text" name="valor" class="input-edicion"
                                       th:value="${usuario.nombres}"
                                       data-original="${usuario.nombres}"
                                       placeholder="Ej: David"
                                       pattern="[A-Za-zÁáÉéÍíÓóÚúÑñ\s]+"
                                       autocomplete="given-name"
                                       required />
                                <div class="error-mensaje"></div>
                            </div>
                            <div class="botones-edicion">
                                <button type="submit" class="btn-guardar">
                                    <i class="bi bi-check-lg"></i> Guardar
                                </button>
                                <button type="button" class="btn-cancelar" onclick="cancelarEdicion('campo-nombres')">
                                    <i class="bi bi-x-lg"></i> Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- ============================== -->
                <!-- Apellidos (editable) -->
                <!-- ============================== -->
                <div id="campo-apellidos" class="campo-bloque">
                    <div class="modo-lectura">
                        <div class="campo-info">
                            <div class="campo-icono"><i class="bi bi-person-lines-fill"></i></div>
                            <div class="campo-detalle">
                                <div class="campo-etiqueta">Apellidos</div>
                                <div class="campo-valor" th:text="${usuario.apellidos != null ? usuario.apellidos : '-'}"></div>
                            </div>
                        </div>
                        <div class="campo-acciones">
                            <button class="btn-editar" type="button" onclick="activarEdicion('campo-apellidos')">Editar</button>
                        </div>
                    </div>
                    <div class="modo-edicion">
                        <form class="form-edicion" th:action="@{/perfil/actualizar}" method="post"
                              data-idcampo="campo-apellidos"
                              onsubmit="return guardarCampo(event, this, 'campo-apellidos')">
                            <input type="hidden" name="id" th:value="${usuario.id}" />
                            <input type="hidden" name="campo" value="apellidos" />
                            <div class="input-group-edicion">
                                <input type="text" name="valor" class="input-edicion"
                                       th:value="${usuario.apellidos}"
                                       data-original="${usuario.apellidos}"
                                       placeholder="Ej: Alva"
                                       pattern="[A-Za-zÁáÉéÍíÓóÚúÑñ\s]+"
                                       autocomplete="family-name"
                                       required />
                                <div class="error-mensaje"></div>
                            </div>
                            <div class="botones-edicion">
                                <button type="submit" class="btn-guardar">
                                    <i class="bi bi-check-lg"></i> Guardar
                                </button>
                                <button type="button" class="btn-cancelar" onclick="cancelarEdicion('campo-apellidos')">
                                    <i class="bi bi-x-lg"></i> Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- ============================== -->
                <!-- Correo (editable) -->
                <!-- ============================== -->
                <div id="campo-email" class="campo-bloque">
                    <div class="modo-lectura">
                        <div class="campo-info">
                            <div class="campo-icono"><i class="bi bi-envelope"></i></div>
                            <div class="campo-detalle">
                                <div class="campo-etiqueta">Correo electrónico</div>
                                <div class="campo-valor" th:text="${usuario.email != null ? usuario.email : '-'}"></div>
                            </div>
                        </div>
                        <div class="campo-acciones">
                            <button class="btn-editar" type="button" onclick="activarEdicion('campo-email')">Editar</button>
                        </div>
                    </div>
                    <div class="modo-edicion">
                        <form class="form-edicion" th:action="@{/perfil/actualizar}" method="post"
                              data-idcampo="campo-email"
                              onsubmit="return guardarCampo(event, this, 'campo-email')">
                            <input type="hidden" name="id" th:value="${usuario.id}" />
                            <input type="hidden" name="campo" value="email" />
                            <div class="input-group-edicion">
                                <input type="email" name="valor" class="input-edicion"
                                       th:value="${usuario.email}"
                                       data-original="${usuario.email}"
                                       placeholder="Ej: correo@ejemplo.com"
                                       autocomplete="email"
                                       required />
                                <div class="error-mensaje"></div>
                            </div>
                            <div class="botones-edicion">
                                <button type="submit" class="btn-guardar">
                                    <i class="bi bi-check-lg"></i> Guardar
                                </button>
                                <button type="button" class="btn-cancelar" onclick="cancelarEdicion('campo-email')">
                                    <i class="bi bi-x-lg"></i> Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- ============================== -->
                <!-- Teléfono (editable) -->
                <!-- ============================== -->
                <div id="campo-telefono" class="campo-bloque">
                    <div class="modo-lectura">
                        <div class="campo-info">
                            <div class="campo-icono"><i class="bi bi-telephone"></i></div>
                            <div class="campo-detalle">
                                <div class="campo-etiqueta">Teléfono</div>
                                <div class="campo-valor" th:text="${usuario.telefono != null ? usuario.telefono : '-'}"></div>
                            </div>
                        </div>
                        <div class="campo-acciones">
                            <button class="btn-editar" type="button" onclick="activarEdicion('campo-telefono')">Editar</button>
                        </div>
                    </div>
                    <div class="modo-edicion">
                        <form class="form-edicion" th:action="@{/perfil/actualizar}" method="post"
                              data-idcampo="campo-telefono"
                              onsubmit="return guardarCampo(event, this, 'campo-telefono')">
                            <input type="hidden" name="id" th:value="${usuario.id}" />
                            <input type="hidden" name="campo" value="telefono" />
                            <div class="input-group-edicion">
                                <input type="text" name="valor" class="input-edicion"
                                       th:value="${usuario.telefono}"
                                       data-original="${usuario.telefono}"
                                       placeholder="Ej: 999888777"
                                       pattern="[0-9]{9}"
                                       maxlength="9"
                                       autocomplete="tel"
                                       required />
                                <div class="error-mensaje"></div>
                            </div>
                            <div class="botones-edicion">
                                <button type="submit" class="btn-guardar">
                                    <i class="bi bi-check-lg"></i> Guardar
                                </button>
                                <button type="button" class="btn-cancelar" onclick="cancelarEdicion('campo-telefono')">
                                    <i class="bi bi-x-lg"></i> Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- ============================== -->
                <!-- Dirección (editable) -->
                <!-- ============================== -->
                <div id="campo-direccion" class="campo-bloque">
                    <div class="modo-lectura">
                        <div class="campo-info">
                            <div class="campo-icono"><i class="bi bi-house"></i></div>
                            <div class="campo-detalle">
                                <div class="campo-etiqueta">Dirección</div>
                                <div class="campo-valor" th:text="${usuario.direccion != null ? usuario.direccion : '-'}"></div>
                            </div>
                        </div>
                        <div class="campo-acciones">
                            <button class="btn-editar" type="button" onclick="activarEdicion('campo-direccion')">Editar</button>
                        </div>
                    </div>
                    <div class="modo-edicion">
                        <form class="form-edicion" th:action="@{/perfil/actualizar}" method="post"
                              data-idcampo="campo-direccion"
                              onsubmit="return guardarCampo(event, this, 'campo-direccion')">
                            <input type="hidden" name="id" th:value="${usuario.id}" />
                            <input type="hidden" name="campo" value="direccion" />
                            <div class="input-group-edicion">
                                <input type="text" name="valor" class="input-edicion"
                                       th:value="${usuario.direccion}"
                                       data-original="${usuario.direccion}"
                                       placeholder="Ej: Av. Los Olivos 123"
                                       maxlength="120"
                                       autocomplete="street-address"
                                       required />
                                <div class="error-mensaje"></div>
                            </div>
                            <div class="botones-edicion">
                                <button type="submit" class="btn-guardar">
                                    <i class="bi bi-check-lg"></i> Guardar
                                </button>
                                <button type="button" class="btn-cancelar" onclick="cancelarEdicion('campo-direccion')">
                                    <i class="bi bi-x-lg"></i> Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- ============================== -->
                <!-- Usuario (no editable) -->
                <!-- ============================== -->
                <div id="campo-usuario" class="campo-bloque">
                    <div class="modo-lectura">
                        <div class="campo-info">
                            <div class="campo-icono"><i class="bi bi-person-badge"></i></div>
                            <div class="campo-detalle">
                                <div class="campo-etiqueta">Usuario</div>
                                <div class="campo-valor" th:text="${usuario.username}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ============================== -->
                <!-- Documento (no editable) -->
                <!-- ============================== -->
                <div id="campo-documento" class="campo-bloque">
                    <div class="modo-lectura">
                        <div class="campo-info">
                            <div class="campo-icono"><i class="bi bi-credit-card-2-front"></i></div>
                            <div class="campo-detalle">
                                <div class="campo-etiqueta">Documento de identidad</div>
                                <div class="campo-valor" th:text="${usuario.documentoIdentidad != null ? usuario.documentoIdentidad : '-'}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ============================== -->
                <!-- Rol (solo admin) -->
                <!-- ============================== -->
                <th:block th:if="${isAdmin}">
                    <div id="campo-rol" class="campo-bloque">
                        <div class="modo-lectura">
                            <div class="campo-info">
                                <div class="campo-icono"><i class="bi bi-shield-lock"></i></div>
                                <div class="campo-detalle">
                                    <div class="campo-etiqueta">Rol</div>
                                    <div class="campo-valor" th:text="${usuario.role}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </th:block>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{vistas/footer::footer}"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.addEventListener('load', function () {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.display = 'none';
            }
            document.body.classList.add('page-loaded');
        });

        function activarEdicion(idBloque) {
            const bloque = document.getElementById(idBloque);
            if (!bloque) return;

            const errorDiv = bloque.querySelector('.error-mensaje');
            if (errorDiv) {
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
            }

            bloque.classList.add('editando');
            const input = bloque.querySelector('input[name="valor"]');
            if (input) {
                input.dataset.original = input.value;
                input.focus();
            }
        }

        function cancelarEdicion(idBloque) {
            const bloque = document.getElementById(idBloque);
            if (!bloque) return;

            const input = bloque.querySelector('input[name="valor"]');
            if (input && input.dataset.original !== undefined) {
                input.value = input.dataset.original;
            }

            const errorDiv = bloque.querySelector('.error-mensaje');
            if (errorDiv) {
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
            }

            bloque.classList.remove('editando');
        }

        function validarCampo(input) {
            const tipo = input.form.querySelector('input[name="campo"]').value;
            const valor = input.value.trim();
            let mensaje = '';

            if (!valor) {
                mensaje = 'Este campo es obligatorio.';
            } else {
                if (tipo === 'nombres' || tipo === 'apellidos') {
                    const regex = /^[A-Za-zÁáÉéÍíÓóÚúÑñ\s]+$/;
                    if (!regex.test(valor)) {
                        mensaje = 'Solo se permiten letras y espacios.';
                    }
                } else if (tipo === 'email') {
                    const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!regexEmail.test(valor)) {
                        mensaje = 'Ingrese un correo electrónico válido.';
                    }
                } else if (tipo === 'telefono') {
                    const regexTel = /^[0-9]{9}$/;
                    if (!regexTel.test(valor)) {
                        mensaje = 'El teléfono debe tener 9 dígitos numéricos.';
                    }
                } else if (tipo === 'direccion') {
                    if (valor.length > 120) {
                        mensaje = 'La dirección no puede superar los 120 caracteres.';
                    }
                }
            }

            const errorDiv = input.closest('.input-group-edicion').querySelector('.error-mensaje');
            if (mensaje) {
                errorDiv.textContent = mensaje;
                errorDiv.style.display = 'block';
                return false;
            } else {
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
                return true;
            }
        }

        async function guardarCampo(evento, formulario, idBloque) {
            evento.preventDefault();

            const bloque = document.getElementById(idBloque);
            if (!bloque) return false;

            const input = formulario.querySelector('input[name="valor"]');
            if (!validarCampo(input)) {
                return false;
            }

            const formData = new FormData(formulario);
            const url = formulario.getAttribute('action');
            const btnGuardar = formulario.querySelector('.btn-guardar');

            const textoOriginal = btnGuardar.innerHTML;
            btnGuardar.innerHTML = '<span class="cargando-spinner"></span> Guardando...';
            btnGuardar.disabled = true;

            try {
                const respuesta = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                if (!respuesta.ok) {
                    const textoError = await respuesta.text();
                    throw new Error(textoError || 'Error del servidor');
                }

                const nuevoValor = formData.get('valor');

                // Actualiza el valor del campo editado
                const spanValor = bloque.querySelector('.modo-lectura .campo-valor');
                if (spanValor) {
                    spanValor.textContent = nuevoValor;
                }

                bloque.classList.remove('editando');
                input.dataset.original = nuevoValor;

                Swal.fire({
                    icon: 'success',
                    title: 'Los cambios se guardaron correctamente.',
                    showConfirmButton: false,
                    timer: 2000
                });

            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error al guardar',
                    text: error.message || 'Ocurrió un problema al actualizar el campo.',
                    confirmButtonColor: '#0054a0'
                });
            } finally {
                btnGuardar.innerHTML = textoOriginal;
                btnGuardar.disabled = false;
            }

            return false;
        }
    </script>

</body>
</html>
