<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contactos_editar</title>
    <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #00bfff">
    <div class="container my-5">
        <div class="bg-white rounded shadow p-5">
            <h1 class="text-center mb-2 text-warning fw-bold">Contacto a editar</h1>
            <hr class="mt-0 mb-4" style="border: 2px solid #00bfff; opacity: 1;">
            <form id="editForm" th:object="${contactos}">
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <p th:text="${errorMessage}"></p>
                </div>
                <div class="mb-4">
                    <label for="idcontactos" class="form-label fw-semibold fs-5" style="color: #0277bd;">Id Contacto:</label>
                    <input type="number" th:field="*{idcontactos}" class="form-control" readonly="true"/> 
                </div>  
                <div class="mb-4">
                    <label for="nombre" class="form-label fw-semibold fs-5" style="color: #0277bd;">Nombre:</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required="true"/> 
                </div>    
                <div class="mb-4">
                    <label for="correo" class="form-label fw-semibold fs-5" style="color: #0277bd;">Correo:</label>
                    <input type="email" th:field="*{correo}" class="form-control" required="true"/> 
                </div>  
                <div class="mb-4">
                    <label for="mensaje" class="form-label fw-semibold fs-5" style="color: #0277bd;">Mensaje</label>
                    <textarea id="mensaje" rows="4" name="mensaje" th:field="*{mensaje}" class="form-control" required="true"></textarea>
                </div>  
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-warning fw-bold py-2 px-4 shadow-lg" style="border-radius: 2rem; transition: all 0.3s ease-in-out;">
                        Guardar
                    </button>
                    <a href="/formResultadoContactos" class="btn btn-light text-dark fw-bold py-2 px-4 shadow-lg" style="border-radius: 2rem; transition: all 0.3s ease-in-out;">
                        Volver sin Guardar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("editForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            fetch("/updateContactos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    return fetch("/getListJSON");
                } else {
                    alert("Hubo un error al actualizar el contacto");
                    throw new Error("Error al actualizar el contacto");
                }
            })
            .then(response => response.json())
            .then(data => {
                sessionStorage.setItem('listaContactos', JSON.stringify(data));
                window.location.href = "/formResultadoContactos"; 
            })
            .catch(error => console.error("Error:", error));
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
</body>
</html>
