<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reserva_editar</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"/>
</head>
<body style="background-color: #00bfff">
    <div class="container my-5">
        <h1 class="text-center mb-4 text-white">Reserva a editar</h1>
        
        <!-- Formulario de edición -->
        <form id="editForm" th:object="${contactos}">
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>
            <div class="mb-3">
                <label for="idcolaborador" class="form-label text-white">Id Colaborador:</label>
                <input type="number" th:field="*{idcontactos}" class="form-control bg-transparent border-light text-white" readonly="true"/> 
            </div>  
            <div class="mb-3">
                <label for="nombre" class="form-label text-white">Nombre:</label>
                <input type="text" th:field="*{nombre}" class="form-control bg-transparent border-light text-white" required="true"/> 
            </div>    
            <div class="mb-3">
                <label for="correo" class="form-label text-white">Correo:</label>
                <input type="email" th:field="*{correo}" class="form-control bg-transparent border-light text-white" required="true"/> 
            </div>  
            <div class="mb-3">
                <label th:text="#{form.sugerencias.mensaje}" for="mensaje" class="form-label text-white">Mensaje</label>
                <textarea id="mensaje" rows="4" th:placeholder="#{form.sugerencias.mensaje.placeholder}" name="mensaje" th:field="*{mensaje}" class="form-control bg-transparent border-light text-white" required="true"></textarea>
            </div>  
            <div class="text-center">
                <button type="submit" class="btn btn-warning btn-block fw-bold py-3">Guardar</button>
            </div>
            <div class="text-center mt-3">
                <a href="/formResultadoContactos" class="btn btn-warning text-white">Volver sin Guardar</a>
            </div>
        </form>
    </div>

    <!-- Script para enviar el formulario mediante fetch -->
    <script>
        document.getElementById("editForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Evita que el formulario se envíe de forma tradicional

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            fetch("/updateContactos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    // Llama a la API para obtener la lista actualizada de contactos
                    return fetch("/getListJSON");
                } else {
                    alert("Hubo un error al actualizar el contacto");
                    throw new Error("Error al actualizar el contacto");
                }
            })
            .then(response => response.json())
            .then(data => {
                // Actualiza el sessionStorage con la nueva lista de contactos
                sessionStorage.setItem('listaContactos', JSON.stringify(data));
                // Redirige a la página de resultado
                window.location.href = "/formResultadoContactos"; 
            })
            .catch(error => console.error("Error:", error));
        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
</body>
</html>
