<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Actualizar Rol - Cachina Fish</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap 5.0.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* General body styling */
        body {
            background-color: #f4f8fb;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Main container */
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        /* Title */
        h3 {
            color: #003a63;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Form styling */
        label {
            color: #003a63;
            font-weight: bold;
            font-size: 18px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #0054a0;
            outline: none;
        }

        /* Button styling */
        button {
            width: 100%;
            background-color: #f6a945;
            color: white;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #003a63;
            transform: scale(1.05);
        }

        /* Link styling */
        a {
            text-decoration: none;
            color: #0054a0;
            font-weight: bold;
            font-size: 18px;
            display: block;
            text-align: center;
            margin-top: 30px;
        }

        a:hover {
            color: #f6a945;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Actualizar Rol de Usuario</h3>

        <!-- Form for updating user role -->
        <form th:action="@{/admin/updateRole}" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" class="form-control" required />
            </div>
            <div class="form-group">
                <label for="role">Nuevo Rol:</label>
                <select id="role" name="role" class="form-control">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Actualizar Rol</button>
        </form>

        <!-- Link to return to the admin panel -->
        <a th:href="@{/admin}"><i class="bi bi-arrow-left-circle"></i> Volver al Panel de Administración</a>
    </div>

    <!-- Bootstrap 5.0.2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
