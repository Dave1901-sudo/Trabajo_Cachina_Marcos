<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Editar Pedido</title>
        <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
        <style>
            body {
                background: #f4f8fb;
                font-family: Arial, sans-serif;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px 0;
            }
            .edit-container {
                background: white;
                width: 90%;
                max-width: 750px;
                padding: 40px;
                border-radius: 15px;
                box-shadow: 0 10px 35px rgba(0, 0, 0, .15);
            }
            h2 {
                text-align: center;
                color: #f6a945;
                margin-bottom: 35px;
                font-weight: bold;
            }
            .form-group {
                margin-bottom: 20px;
            }
            .form-control {
                border: 1px solid #0054a0;
            }
            .form-control:focus {
                border-color: #f6a945;
                box-shadow: 0 0 0 .2rem rgba(246, 169, 69, .25);
            }
            .input-group-text {
                border: 1px solid #0054a0;
                background: white;
            }
            .input-icon {
                color: #0054a0;
            }
            .btn-save {
                background: #0054a0;
                color: white;
                font-weight: bold;
            }
            .btn-save:hover {
                background: #f6a945;
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="edit-container">
            <h2><i class="bi bi-pencil-square"></i> Editar Pedido</h2>

            <form th:action="@{/pedidos/editar/{id}(id=${pedido.id})}" method="post">
                <div class="form-group">
                    <label>Fecha de Pedido</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-calendar input-icon"></i></span>
                        <input type="date" class="form-control" th:value="${#dates.format(pedido.fechaPedido, 'yyyy-MM-dd')}" name="fechaPedido" readonly required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Total</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-currency-dollar input-icon"></i></span>
                        <input type="number" class="form-control" th:value="${pedido.total}" name="total" readonly required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope input-icon"></i></span>
                        <input type="email" class="form-control" th:value="${pedido.email}" name="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Número de teléfono</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone input-icon"></i></span>
                        <input type="tel" class="form-control" th:value="${pedido.phone}" name="phone" maxlength="9" pattern="\d{9}" title="El número debe tener exactamente 9 dígitos" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Dirección</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-geo-alt input-icon"></i></span>
                        <input type="text" class="form-control" th:value="${pedido.direccion}" name="direccion" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person input-icon"></i></span>
                        <select class="form-control" name="usuarioId">
                            <option value="">Seleccione un usuario</option>
                            <option th:each="user : ${usuarios}"
                                    th:value="${user.id}"
                                    th:text="${user.username + ' (' + user.nombres + ' ' + user.apellidos + ')'}"
                                    th:selected="${pedido.usuario != null and pedido.usuario.id == user.id}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-between">
                    <a href="/pedidos" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-save">
                        <i class="bi bi-save"></i> Actualizar Pedido
                    </button>
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
