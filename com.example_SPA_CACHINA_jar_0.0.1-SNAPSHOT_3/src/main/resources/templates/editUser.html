<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Usuario</title>
    <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:#f4f8fb;
            font-family:Arial,sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 0;
        }

        .edit-container{

            background:white;
            width:90%;
            max-width:750px;

            padding:40px;

            border-radius:15px;

            box-shadow:0 10px 35px rgba(0,0,0,.15);

        }

        h2{

            text-align:center;
            color:#f6a945;
            margin-bottom:35px;
            font-weight:bold;

        }

        .form-group{

            margin-bottom:20px;

        }

        .form-control{

            border:1px solid #0054a0;

        }

        .form-control:focus{

            border-color:#f6a945;
            box-shadow:0 0 0 .2rem rgba(246,169,69,.25);

        }

        .input-group-text{

            border:1px solid #0054a0;
            background:white;

        }

        .input-icon{

            color:#0054a0;

        }

        .btn-save{

            background:#0054a0;
            color:white;
            font-weight:bold;

        }

        .btn-save:hover{

            background:#f6a945;
            color:white;

        }

    </style>

</head>

<body>

<div class="edit-container">

    <h2>
        Editar Usuario
    </h2>
    
    <div class="alert alert-danger"
     th:if="${errorMessage}"
     th:text="${errorMessage}">
    </div>

    <form
            th:action="@{/admin/updateUser}"
            method="post">

        <input
                type="hidden"
                name="id"
                th:value="${usuario.id}"/>

        <!-- Usuario -->

        <div class="form-group">

            <label>Usuario</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person input-icon"></i>
                </span>

                <input
                        class="form-control"
                        name="username"
                        th:value="${usuario.username}"
                        readonly>

            </div>

        </div>

        <div class="form-group mt-3">

            <label>Nuevo nombre de usuario</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person-plus input-icon"></i>
                </span>

                <input
                        type="text"
                        class="form-control"
                        name="newUsername"
                        placeholder="Nuevo nombre de usuario">

            </div>
            <small class="text-muted">Si se deja en blanco, el nombre de usuario se mantiene igual.</small>

        </div>


        <!-- Nombres / Apellidos -->

        <div class="row g-3">

            <div class="col-md-6">

                <div class="form-group">

                    <label>Nombres</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person input-icon"></i>
                        </span>

                        <input
                                type="text"
                                class="form-control"
                                name="nombres"
                                th:value="${usuario.nombres}"
                                required>

                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="form-group">

                    <label>Apellidos</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person-vcard input-icon"></i>
                        </span>

                        <input
                                type="text"
                                class="form-control"
                                name="apellidos"
                                th:value="${usuario.apellidos}"
                                required>

                    </div>

                </div>

            </div>

        </div>

        <!-- Correo -->

        <div class="form-group">

            <label>Correo electrónico</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-envelope input-icon"></i>
                </span>

                <input
                        type="email"
                        class="form-control"
                        name="email"
                        th:value="${usuario.email}"
                        required>

            </div>

        </div>

        <!-- Teléfono / Documento -->

        <div class="row g-3">

            <div class="col-md-6">

                <div class="form-group">

                    <label>Teléfono</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-telephone input-icon"></i>
                        </span>

                        <input
                                type="text"
                                class="form-control"
                                name="telefono"
                                th:value="${usuario.telefono}"
                                required
                                maxlength="9"
                                pattern="[0-9]{9}">

                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="form-group">

                    <label>Documento de identidad</label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-card-text input-icon"></i>
                        </span>

                        <input
                                type="text"
                                class="form-control"
                                name="documentoIdentidad"
                                th:value="${usuario.documentoIdentidad}"
                                required
                                maxlength="8"
                                pattern="[0-9]{8}">

                    </div>

                </div>

            </div>

        </div>

        <!-- Dirección -->

        <div class="form-group">

            <label>Dirección</label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-geo-alt input-icon"></i>
                </span>

                <input
                        type="text"
                        class="form-control"
                        name="direccion"
                        th:value="${usuario.direccion}"
                        required>

            </div>

        </div>

        <div class="mt-4 d-flex justify-content-between">

            <a
                    th:href="@{/admin/userList}"
                    class="btn btn-secondary">

                Cancelar

            </a>

            <button
                    type="submit"
                    class="btn btn-save">

                <i class="bi bi-save"></i>

                Guardar cambios

            </button>

        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
