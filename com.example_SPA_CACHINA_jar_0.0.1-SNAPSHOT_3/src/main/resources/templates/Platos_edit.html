<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Sugerencias_editar</title>
        <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"/>

    </head>
    <body style="background-color: #00bfff">
    <div class="container my-5">
        <div class="bg-white rounded shadow p-5">
            <h1 class="text-center mb-2 text-warning fw-bold">Platos a editar</h1>
            <hr class="mt-0 mb-4">
            <form th:action="@{/registrarPlatos}" th:object="${platos}" method="post" enctype="multipart/form-data" onsubmit="return validarCategoria() && validarTamañoArchivo()">
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div class="mb-4">
                    <label for="idPlato" class="form-label fw-semibold fs-5" style="color: #0277bd;">Id Plato:</label>
                    <input type="number" th:field="*{idplato}" class="form-control" readonly="true"/> 
                </div>  

                <div class="mb-4">
                    <label for="nombre" class="form-label fw-semibold fs-5" style="color: #0277bd;">Nombre:</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required="true"/> 
                </div>    

                <div class="mb-4">
                    <label for="descripcion" class="form-label fw-semibold fs-5" style="color: #0277bd;">Descripción:</label>
                    <input type="text" th:field="*{descripcion}" class="form-control" required="true"/> 
                </div>  

                <div class="mb-4">
                    <label for="precio" class="form-label fw-semibold fs-5" style="color: #0277bd;">Precio:</label>
                    <input type="number" th:field="*{precio}" class="form-control" required="true" step="0.01"/> 
                </div>

                <div class="mb-4">
                    <label for="categoriaSelect" class="form-label fw-semibold fs-5" style="color: #0277bd;">Categoría</label>
                    <div class="input-group" onclick="document.getElementById('categoriaSelect').focus();">
                        <select class="form-control" id="categoriaSelect" onchange="toggleNuevaCategoria(this)" required>
                            <option value="" disabled selected hidden>Seleccionar categoría</option>
                            <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}" th:selected="${cat == platos.categoria}"></option>
                            <option value="__NUEVA__">+ Agregar categoría nueva</option>
                        </select>
                        <span class="input-group-text bg-white" onclick="event.stopPropagation(); var s=document.getElementById('categoriaSelect'); s.focus(); s.click();">▼</span>
                    </div>
                    <input type="text" th:field="*{categoria}" class="form-control mt-2" required="true" id="categoriaInput" style="display: none;" th:placeholder="'Escriba la nueva categoría'"/>
                </div>  

                <div class="mb-4">
                    <label for="imagenActual" class="form-label fw-semibold fs-5" style="color: #0277bd;">Imagen Actual:</label>
                    <img th:src="@{/imagen/{id}(id=${platos.idplato})}" 
                         alt="Imagen del plato" 
                         class="img-fluid rounded p-2 mb-3 shadow" 
                         style="max-width: 200px; height: auto; display: block; border: 2px solid #ddd;" />
                </div>

                <div class="mb-4">
                    <label for="imagenArchivo" class="form-label fw-semibold fs-5" style="color: #0277bd;">Nueva Imagen (opcional):</label>
                    <input type="file" class="form-control" 
                           name="imagenArchivo" id="imagenArchivo" accept="image/*" />
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-warning fw-bold py-2 px-4 shadow-lg" style="border-radius: 2rem; transition: all 0.3s ease-in-out;">
                        Guardar
                    </button>
                    <a href="/formResultadoPlatos" class="btn btn-light text-dark fw-bold py-2 px-4 shadow-lg" style="border-radius: 2rem; transition: all 0.3s ease-in-out;">
                        Volver sin Guardar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function toggleNuevaCategoria(select) {
            var input = document.getElementById('categoriaInput');
            if (select.value === '__NUEVA__') {
                input.style.display = 'block';
                input.value = '';
                input.focus();
            } else {
                input.style.display = 'none';
                input.value = select.value;
            }
        }
        function validarTamañoArchivo() {
            var fileInput = document.getElementById('imagenArchivo');
            if (fileInput.files.length > 0) {
                var fileSize = fileInput.files[0].size;
                var maxSize = 10 * 1024 * 1024;
                if (fileSize > maxSize) {
                    Swal.fire({
                        toast: true,
                        position: 'bottom-end',
                        icon: 'error',
                        title: 'El archivo es demasiado grande. Máximo 10 MB.',
                        showConfirmButton: false,
                        timer: 3000,
                        timerProgressBar: false
                    });
                    return false;
                }
            }
            return true;
        }
        function validarCategoria() {
            var select = document.getElementById('categoriaSelect');
            var input = document.getElementById('categoriaInput');
            if (select.value === '__NUEVA__' && input.value.trim() !== '') {
                var options = select.options;
                for (var i = 0; i < options.length; i++) {
                    if (options[i].value !== '' && options[i].value !== '__NUEVA__' && options[i].value.toLowerCase() === input.value.trim().toLowerCase()) {
                        Swal.fire({
                            toast: true,
                            position: 'bottom-end',
                            icon: 'warning',
                            title: 'Esa categoría ya existe. Selecciónala del listado.',
                            showConfirmButton: false,
                            timer: 2500,
                            timerProgressBar: false
                        });
                        return false;
                    }
                }
            }
            return true;
        }
        window.onload = function() {
            var select = document.getElementById('categoriaSelect');
            var input = document.getElementById('categoriaInput');
            if (select && input.value && !Array.from(select.options).some(o => o.value === input.value)) {
                select.value = '__NUEVA__';
                input.style.display = 'block';
            }
        };
    </script>
</body>


</html>
