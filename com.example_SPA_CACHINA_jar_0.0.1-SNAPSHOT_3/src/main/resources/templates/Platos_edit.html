<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Sugerencias_editar</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    </head>
    <body style="background-color: #00bfff">
    <div class="container my-5">
        <h1 class="text-center mb-4 text-white fw-bold">Platos a editar</h1>
        <form th:action="@{/registrarPlatos}" th:object="${platos}" method="post" enctype="multipart/form-data">
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <p th:text="${errorMessage}"></p>
            </div>

            <div class="mb-4">
                <label for="idPlato" class="form-label text-white fs-5">Id Plato:</label>
                <input type="number" th:field="*{idplato}" class="form-control bg-transparent border-light text-white" readonly="true"/> 
            </div>  

            <div class="mb-4">
                <label for="nombre" class="form-label text-white fs-5">Nombre:</label>
                <input type="text" th:field="*{nombre}" class="form-control bg-transparent border-light text-white" required="true"/> 
            </div>    

            <div class="mb-4">
                <label for="descripcion" class="form-label text-white fs-5">Descripción:</label>
                <input type="text" th:field="*{descripcion}" class="form-control bg-transparent border-light text-white" required="true"/> 
            </div>  

            <div class="mb-4">
                <label for="precio" class="form-label text-white fs-5">Precio:</label>
                <input type="number" th:field="*{precio}" class="form-control bg-transparent border-light text-white" required="true" step="0.01"/> 
            </div>

            <div class="mb-4">
                <label for="categoria" class="form-label text-white fs-5">Categoría:</label>
                <input type="text" th:field="*{categoria}" class="form-control bg-transparent border-light text-white" required="true"/> 
            </div>  

            <div class="mb-4">
                <label for="imagenActual" class="form-label text-white fs-5">Imagen Actual:</label>
                <img th:src="@{/imagen/{id}(id=${platos.idplato})}" 
                     alt="Imagen del plato" 
                     class="img-fluid rounded p-2 mb-3 shadow" 
                     style="max-width: 200px; height: auto; display: block; border: 2px solid rgba(255, 255, 255, 0.5);" />
            </div>

            <div class="mb-4">
                <label for="imagenArchivo" class="form-label text-white fs-5">Nueva Imagen (opcional):</label>
                <input type="file" class="form-control bg-transparent border-light text-white" 
                       name="imagenArchivo" id="imagenArchivo" accept="image/*" />
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-warning btn-block fw-bold py-3 shadow-lg" style="border-radius: 2rem; transition: all 0.3s ease-in-out;">
                    Guardar
                </button>
            </div>

            <div class="text-center mt-3">
                <a href="/formResultadoPlatos" class="btn btn-light text-dark fw-bold py-2 px-4 shadow-lg" style="border-radius: 2rem; transition: all 0.3s ease-in-out;">
                    Volver sin Guardar
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
</body>


</html>
