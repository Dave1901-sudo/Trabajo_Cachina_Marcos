<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contactos_editar</title>
    <link rel="icon" href="imagenes/Logo.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #00bfff">
    <div class="container my-5">
        <h1 class="text-center mb-4 text-white">Contacto a editar</h1>
        <form th:action="@{/registrarReservas}" th:object="${reservas}" method="post">
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <p th:text="${errorMessage}"></p>
        </div>
        <div class="mb-3">
            <label for="idreservas" class="form-label text-white">Id Reservas:</label>
            <input type="number" th:field="*{idreservas}" class="form-control bg-transparent border-light text-white" readonly="true"/> 
        </div>  
        <div class="mb-3">
            <label for="nombre" class="form-label text-white">Nombre:</label>
            <input type="text" th:field="*{nombre}" class="form-control bg-transparent border-light text-white" required="true"/> 
        </div>    
        <div class="mb-3">
            <label for="correo" class="form-label text-white">Correo:</label>
            <input type="email" th:field="*{correo}" class="form-control bg-transparent border-light text-white" required="true"/> 
        </div>  
        <div class="mb-3">
            <label for="fecha" class="form-label text-white">Fecha:</label>
            <input type="date" th:field="*{fecha}" class="form-control bg-transparent border-light text-white" required="true"/> 
        </div> 
        <div class="mb-3">
            <label for="hora" class="form-label text-white">Hora:</label>
            <input type="time" th:field="*{hora}" class="form-control bg-transparent border-light text-white" required="true"/> 
        </div>
        <div class="mb-3">
            <label for="personas" class="form-label text-white">Personas:</label>
            <input type="number" th:field="*{personas}" class="form-control bg-transparent border-light text-white" required="true"/> 
        </div> 
        <div class="text-center">
            <button type="submit" class="btn btn-warning btn-block fw-bold py-3" style="border-radius: 2rem;">Guardar</button>
        </div>
        <div class="text-center mt-3">
            <a href="/" class="btn btn-warning text-white">Volver sin Guardar</a>
        </div>
    </form>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.min.js"></script>
</body>
</html>
