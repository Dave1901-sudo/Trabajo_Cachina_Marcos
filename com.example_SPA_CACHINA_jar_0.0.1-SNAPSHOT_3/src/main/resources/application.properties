spring.application.name=SPA_CACHINA

server.port=${PORT:8081}

# Usuario temporal de Spring Security
spring.security.user.name=${SECURITY_USER:dave}
spring.security.user.password=${SECURITY_PASSWORD:123}
spring.security.user.roles=${SECURITY_ROLE:ADMIN}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spa_cachinafish?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ROOT}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Brevo API
brevo.api.key=${BREVO_API_KEY}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.context.annotation=ERROR
logging.level.org.springframework.core=ERROR
logging.level.root=WARN
logging.level.org.springframework=WARN

# messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8