spring.application.name=SPA_CACHINA

server.port=${PORT:8080}

# Usuario temporal de Spring Security
spring.security.user.name=${SECURITY_USER:dave}
spring.security.user.password=${SECURITY_PASSWORD:123}
spring.security.user.roles=${SECURITY_ROLE:ADMIN}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spa_cachinafish?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ROOT}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Correo electr\u00f3nico
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:davearmandosilvaalva@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.context.annotation=ERROR
logging.level.org.springframework.core=ERROR
logging.level.root=WARN
logging.level.org.springframework=WARN

# messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8