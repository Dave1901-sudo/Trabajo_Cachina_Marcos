name: Backup a S3 y Google Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir a AWS S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }}/backups/$(date +%Y-%m-%d)/ \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Subir a Google Drive con rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          echo "$RCLONE_CONFIG" > /tmp/rclone.conf
          rclone sync . "gdrive:backup-cachinafish/$(date +%Y-%m-%d)" \
            --config /tmp/rclone.conf \
            --exclude ".git/*" \
            --exclude ".github/*"
